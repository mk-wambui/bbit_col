<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<style>

body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

.content{
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

form{
    width: 350px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background-color: #f5f5f5;
}

input,
textarea{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 5px;
    border: 1px solid #999;
}

button{
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    background-color: brown;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover{
    background-color: darkred;
}

</style>
<body>

    <div class="toplink">  
        <a href="./">Home</a> &#65372;
        <a href="about.html">Go to About Page</a> &#65372;
        <a href="project.html">Go to Projects Page</a> &#65372; 
        <a href="contact.html">Go to Contact Page</a>
    </div>

    <div class="banner">
        <h1>Talk to us</h1>
    </div>

    <div class="row">

        <div class="left_side_bar">
            <h3>Left Side Bar</h3>
        </div>

        <div class="content">

            <h2>Contact Us</h2>
            <p>This is the contact page for our website.</p>

            <form action="">

                <label for="fullname">Full Name:</label><br>
                <input type="text" name="fullname" placeholder="Enter your Name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" name="email" placeholder="Enter your Email" required><br><br>

                <label for="number">Phone Number:</label><br>
                <input type="number" name="number" placeholder="Enter your Phone Number" required><br><br>

                <label for="subject">Subject Line:</label><br>
                <input type="text" name="subject" placeholder="Enter your Subject" required><br><br>

                <label for="message">Message:</label><br>
                <textarea name="message" rows="5" cols="30" placeholder="Enter your message" required></textarea><br><br>

                <button type="submit">Send Message</button>

            </form>

        </div>

    </div>

</body>
</html>
